<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#kg)"/>
  <!-- ascending skyline (property & economy empire) -->
  <g fill="#ffffff">
    <rect x="6" y="17" width="5" height="9" rx="1"/>
    <rect x="12.5" y="9" width="6" height="17" rx="1"/>
    <rect x="20" y="14" width="5" height="12" rx="1"/>
  </g>
  <!-- windows -->
  <g fill="#0d9488">
    <rect x="14" y="12" width="1.4" height="1.4"/>
    <rect x="16.1" y="12" width="1.4" height="1.4"/>
    <rect x="14" y="15" width="1.4" height="1.4"/>
    <rect x="16.1" y="15" width="1.4" height="1.4"/>
  </g>
  <!-- gold coin accent -->
  <circle cx="24" cy="8" r="4" fill="#fbbf24"/>
  <circle cx="24" cy="8" r="4" fill="none" stroke="#f59e0b" stroke-width="1"/>
</svg>
